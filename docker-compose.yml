# This is a **DEVELOPMENT** docker-compose. It will mostly make reference to development Dockerfiles where relevant.
# IT is a very unsafe environment for this to end up in production. Good for dev.

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "5430:5432"
    networks:
      - odoo_network
    volumes:
      - ${HOME}/data/cony/odoo/mounts/database:/var/lib/postgresql/data:Z
      - ${HOME}/data/cony/odoo/database_dumps/:/opt/postgres_dumps/
    restart: unless-stopped

  odoo:
    image: odoo:odoo:final-dev-16 # 最後一次用這個映像。現在已EOL
    volumes:
      - .:/workspace:Z
      - ${HOME}/data/cony/odoo/mounts/filestore/:/var/lib/odoo
      - ${HOME}/projects/cony/odoo/odoo_addons:/mnt/extra-addons
      - ./odoo.conf /etc/odoo.conf 
    networks:
      - odoo_network
    ports:
      - 8069:8069
      - 8072:8072
    depends_on:
      - db
    environment:
      TZ: America/Tegucigalpa
      PYTHONPATH: "."
    #entrypoint: ["/workspace/odoo-bin"] # We now used neutralize_database.py to ensure the database is neutralized before we launch it
    entrypoint: ["sleep", "infinity"] 
    #entrypoint: ["python", "/workspace/scripts/odoo-neutralize_database.py"] 
    # command: 
    #   - "--db_password"
      # - "${ODOO_USER_DB_PASSWORD}"
      # - "--load=web,queue_job"
      # - "--workers=4"
      # - - "--gevent-port=8072"
      # - "-u"
      # - "cony_base_utils"
      # - "-u"
      # - "pos_receipt_hn_tm30ii"
      # - "-u"
      # - "whatsapp_business_cloud"
      # - "-u"
      # - "s3_base_utils"
      # - "-u"
      # - "hr_recruitment_cony"
      # - "-u"
      # - "sar_excel_reports"
      # - "-u"
      # - "pos_loyalty_qr_scanner"
      # - "-u"
      # - "production_dashboard"
      # # - "--test-enable"
      # - "-u"
      # - "cony_webhook_auth"
      # - "-u"
      # - "hr_recruitment_cony"
      # - "-u"
      # - "sidecart_webhook_base"
      # # - "--test-enable"
      # # - "--stop-after-init"
     
  odoo-test:
    profiles:
      - test #  only to be run on test
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - /mnt/odooaddons/filestore/:/var/lib/odoo
      - /home/ottersome/projects/cony/odoo/odoo_addons:/mnt/extra-addons
    networks:
      - odoo_network
    depends_on:
      - db
    environment:
      TZ: America/Tegucigalpa
      PYTHONUNBUFFERED: 1
    entrypoint: ["/workspace/odoo-bin"]
    command:
      - "-i"
      - "sidecart_webhook_base"
      - "--test-enable"
      - "--test-tags"
      # - "/sidecart_webhook_base:TestSidecartRequestIdentityLock,/sidecart_webhook_base:TestSidecartClientesValidation,sidecart_basic"
      # - "/sidecart_webhook_base:TestSidecartOrders"
      - "/sidecart_webhook_base:TestSidecartApiKeyAuth"
      - "--stop-after-init"
      - "--log-level=test"
      - "--log-handler=odoo.tests:DEBUG"

  sidecart:
    build:
      context: ../odoo-website-sidecart
      dockerfile: Dockerfile
    ports:
      - "8420:8000"
    environment:
      # Odoo connection (adjust to match your Odoo setup)
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USERNAME=${ODOO_USERNAME}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - ODOO_API_KEY=${ODOO_API_KEY}

      # Redis connection
      - REDIS_URL=${REDIS_URL}
      #- REDIS_PASSWORD=${REDIS_PASSWORD}

      # Authentication
      - API_KEY=${API_KEY}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}

      # Service configuration
      # - LOG_LEVEL=${LOG_LEVEL}
      # - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL}
      # - ENVIRONMENT=${ENVIRONMENT}

      # Rate limiting
      # - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      # - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE}

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - odoo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - sidecart
    networks:
      - odoo_network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: sidecart-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - odoo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  odoo_network:
    driver: bridge
