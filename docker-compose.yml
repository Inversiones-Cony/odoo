version: "3.8"

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    networks:
      - odoo_network
    volumes:
      - /mnt/database:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  odoo_network:
    driver: bridge

