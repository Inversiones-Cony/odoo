global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sidecart"
    scrape_interval: 10s
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["sidecart:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
